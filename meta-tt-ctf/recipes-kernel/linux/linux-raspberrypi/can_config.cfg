# CAN kernel support for the CTF baseline.
# Attached to linux-raspberrypi (the kernel actually built), not linux-yocto (§4.1).

# Core CAN stack
CONFIG_CAN=y
CONFIG_CAN_DEV=y
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y

# Protocols
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y

# In-kernel CAN gateway -- the entire CTF gateway design depends on this.
# This is the go/no-go for §4.1; confirm with `cangw -L` on the booted image.
CONFIG_CAN_GW=y

# MCP2518FD controller (Waveshare 2-CH CAN FD HAT). Driver is mcp251xfd, NOT mcp251x.
CONFIG_CAN_MCP251XFD=y

# Virtual CAN kept for BENCH loopback testing only. No vcan interface is configured
# on the target (§5.2 -- the CTF uses two real interfaces, can0 + can1).
CONFIG_CAN_VCAN=y
