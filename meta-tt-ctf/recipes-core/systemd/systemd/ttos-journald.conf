# TTOS: keep the journal across reboots.
#
# Volatile journald plus no RTC means only the current boot is visible AND its
# timestamps are wrong until an NTP sync that never happens on an AP with no
# internet. Judges verify solves by the monotonic sequence number the CTF layer
# logs, but they still need the log to EXIST after the car is power-cycled --
# which is the normal way a station is handed to the next team.
#
# Requires VOLATILE_LOG_DIR = "no" in the kas config, or /var/log is a symlink
# into a tmpfs and "persistent" silently means nothing.
[Journal]
Storage=persistent

# BOUND BY SIZE ONLY. DO NOT ADD MaxRetentionSec -- IT DELETES THE BOOT LOG.
#
# This board has no RTC, so it boots with a stale clock and everything logged
# before timesyncd catches up carries that old timestamp. The moment the clock
# jumps forward, any time-based retention rule sees those entries as years old and
# vacuums them immediately. Measured on a clean flash 2026-08-03 with
# MaxRetentionSec=1week: the first surviving entry in the whole journal was
# "Initial clock synchronization", and every line before it -- provisioning, CTF
# identity load, gateway policy, UDS and relay startup -- was gone. That is exactly
# the evidence this file exists to preserve, destroyed by the config meant to
# preserve it.
#
# Size limits are clock-independent and do the same job.
SystemMaxUse=64M
SystemMaxFileSize=8M

# Nothing consumes the syslog socket on this image, and the forward drops messages
# noisily ("Forwarding to syslog missed N messages").
ForwardToSyslog=no
