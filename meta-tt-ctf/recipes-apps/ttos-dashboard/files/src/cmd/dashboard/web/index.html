<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Trek · Console</title>
<style>
  @font-face{
    font-family:'Shojumaru';
    src:url('shojumaru.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    /* University of Tulsa: royal blue + old gold */
    --bg:#061634; --panel:#0c2350; --panel2:#123063; --border:#22417a;
    --text:#e8eefc; --muted:#8ba0c8; --accent:#4d9fff; --brand:#ffc94d;
    --can0:#5fd0e0; --can1:#ffb85c; --vcan0:#5fd0e0; --vcan1:#ffb85c; --other:#b39bff;
    --ok:#35d07f; --warn:#f0a35e; --err:#ff5c5c; --badge:#16305f;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}

  /* ---- header ---- */
  header{display:flex;align-items:center;gap:20px;padding:12px 22px;
    background:linear-gradient(180deg,#0e2a5e,#081a3c);border-bottom:1px solid var(--border)}
  .logo{font-family:'Shojumaru',var(--sans);font-size:32px;color:var(--brand);
    letter-spacing:1px;text-shadow:0 2px 16px rgba(255,201,77,.35);white-space:nowrap;line-height:1}
  .car{margin-left:6px;display:flex;flex-direction:column;line-height:1.15}
  .car .no{font-family:var(--mono);font-size:20px;font-weight:600}
  .car .host{font-size:12px;color:var(--muted)}
  .conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.live{background:var(--ok);box-shadow:0 0 0 4px rgba(63,185,80,.18)}
  .dot.down{background:var(--err);box-shadow:0 0 0 4px rgba(248,81,73,.18)}

  /* ---- layout ---- */
  main{display:grid;grid-template-columns:1fr 340px;min-height:0}
  .console{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
  .side{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:#050f28}

  /* Non-production image warning. A bench build has an empty root password, so
     this needs to be impossible to miss rather than tasteful. */
  .variant-warn{padding:6px 14px;border-radius:6px;font-weight:700;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--err);color:#fff;box-shadow:0 0 14px rgba(248,81,73,.5)}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;padding:8px 10px 0;background:var(--panel);border-bottom:1px solid var(--border)}
  .tab{display:flex;align-items:center;gap:7px;padding:8px 16px;font-size:13px;color:var(--muted);
    cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);background:var(--bg);border-color:var(--border)}
  .tab .act{width:8px;height:8px;border-radius:50%;background:#2a4676;transition:background .2s}
  .tab .act.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .tab .rate{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .panes{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none;overflow:auto}
  .pane.active{display:block}

  /* ---- frame table ---- */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
  thead th{position:sticky;top:0;background:var(--panel);color:var(--muted);text-align:left;font-weight:500;
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:7px 12px;border-bottom:1px solid var(--border);z-index:1}
  tbody td{padding:3px 12px;border-bottom:1px solid rgba(34,65,122,.4);white-space:nowrap}
  tbody tr:hover{background:rgba(77,159,255,.07)}
  .c-id{color:var(--brand)} .c-time{color:var(--muted)} .c-len{color:var(--muted);text-align:right}
  .c-note{color:var(--muted);font-family:var(--sans);font-size:11px;white-space:nowrap}
  .c-data{color:#c9d1d9;letter-spacing:.5px}
  .badge{display:inline-block;font-size:10px;padding:0 5px;margin-right:3px;border-radius:4px;background:var(--badge);color:var(--muted);border:1px solid var(--border)}
  .b-ext{color:#79c0ff} .b-fd{color:#d2a8ff} .b-rtr{color:#8b949e} .b-brs{color:var(--warn)} .b-err{color:var(--err)}

  /* ---- debug log ---- */
  .log{font-family:var(--mono);font-size:12.5px;padding:6px 0}
  .log .line{display:flex;gap:10px;padding:3px 14px;border-bottom:1px solid rgba(48,54,61,.35)}
  .log .t{color:var(--muted)}
  .log .lv{text-transform:uppercase;font-size:10px;padding:0 6px;border-radius:4px;align-self:center;border:1px solid var(--border)}
  .lv-info{color:var(--accent)} .lv-warn{color:var(--warn)} .lv-cmd{color:var(--brand)} .lv-error{color:var(--err)}
  .log .msg{color:var(--text);white-space:pre-wrap;word-break:break-word}
  .placeholder{color:var(--muted);padding:22px 16px;font-family:var(--sans)}

  /* ---- side cards ---- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .card h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:14px}
  .pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--border);background:var(--badge);color:var(--muted)}
  .pill.up,.pill.online,.pill.active{color:var(--ok);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.12)}
  .pill.down,.pill.offline,.pill.inactive{color:var(--err);border-color:rgba(248,81,73,.35);background:rgba(248,81,73,.1)}
  .pill.unknown,.pill.absent{color:var(--muted)}

  /* ---- 12V banner ---- */
  .v12{border-radius:12px;padding:14px;text-align:center;font-weight:800;letter-spacing:2px;font-size:18px;
    border:1px solid var(--border);background:var(--panel);color:var(--muted);transition:.2s}
  .v12.active{color:#04170a;background:linear-gradient(180deg,#56d364,#2ea043);border-color:#3fb950;
    box-shadow:0 0 22px rgba(63,185,80,.45);animation:pulse 1.4s ease-in-out infinite}
  .v12.inactive{color:var(--muted)}
  @keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(63,185,80,.35)}50%{box-shadow:0 0 30px rgba(63,185,80,.6)}}

  /* ---- battery ---- */
  .bat{display:flex;align-items:center;gap:10px}
  .bat .track{flex:1;height:16px;border-radius:6px;background:#0b0f16;border:1px solid var(--border);overflow:hidden}
  .bat .fill{height:100%;width:0;background:var(--ok);transition:width .4s,background .4s}
  .bat .pct{font-family:var(--mono);font-size:14px;min-width:44px;text-align:right}

  /* ---- controls ---- */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,60px);gap:8px;margin-top:4px}
  .pad button{background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);touch-action:none;
    font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:transform .05s,background .1s,border-color .1s;user-select:none}
  .pad button .lbl{font-size:9px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
  .pad button:hover{border-color:var(--accent)}
  .pad button:active,.pad button.press{transform:scale(.94);background:var(--accent);color:#0d1117}
  .pad button.rot{color:var(--ok)} .pad button.rot:hover{border-color:var(--ok)}
  /* STOP: regular (square) octagon, light-red fill, black text */
  .pad .stop{background:var(--err);border:none;color:#000;font-weight:800;font-size:16px;letter-spacing:1px;
    aspect-ratio:1;height:100%;justify-self:center;
    clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%)}
  .pad .stop:hover{filter:brightness(1.08)} .pad .stop:active,.pad .stop.press{background:var(--err);color:#000;transform:scale(.94);filter:brightness(.9)}
  .spacer{visibility:hidden}
  .hint{margin-top:10px;font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.3px}

  @media(max-width:820px){main{grid-template-columns:1fr}.side{border-top:1px solid var(--border)}}
</style>
</head>
<body>
  <header>
    <div class="logo">Tiny Trek</div>
    <div class="car">
      <div class="no">CAR #<span id="car-id">–</span></div>
      <div class="host" id="car-host">…</div>
    </div>
    <div class="conn"><span id="dot" class="dot"></span><span id="conn-text">connecting…</span></div>
  </header>

  <main>
    <section class="console">
      <div class="tabs" id="tabs"></div>
      <div class="panes" id="panes"></div>
    </section>

    <aside class="side">
      <div class="v12 inactive" id="v12">12V INACTIVE</div>

      <div class="card">
        <h3>Battery</h3>
        <div class="bat"><div class="track"><div class="fill" id="bat-fill"></div></div><div class="pct" id="bat-pct">–</div></div>
      </div>

      <div class="card">
        <h3>Sensors</h3>
        <div class="row">U-Sonic <span class="pill unknown" id="ind-usonic">unknown</span></div>
        <div class="row">Camera <span class="pill unknown" id="ind-camera">unknown</span></div>
      </div>

      <div class="card">
        <h3>Network</h3>
        <div class="row">WiFi <span class="pill unknown" id="ind-wifi">–</span></div>
        <div class="row">Ethernet <span class="pill unknown" id="ind-eth">–</span></div>
      </div>

      <div class="card">
        <h3>Controls</h3>
        <div class="pad">
          <button class="rot" data-cmd="ccw">↺<span class="lbl">CCW</span></button>
          <button data-cmd="forward">▲<span class="lbl">Fwd</span></button>
          <button class="rot" data-cmd="cw">↻<span class="lbl">CW</span></button>
          <button data-cmd="left">◀<span class="lbl">Left</span></button>
          <button class="stop" data-cmd="stop">STOP</button>
          <button data-cmd="right">▶<span class="lbl">Right</span></button>
          <span class="spacer"></span>
          <button data-cmd="back">▼<span class="lbl">Back</span></button>
          <span class="spacer"></span>
        </div>
        <div class="hint">Hold to drive (or arrows/WASD) · STOP cuts 12V</div>
      </div>
    </aside>
  </main>

<script>
(() => {
  const MAX_ROWS = 1500, MAX_LOG = 800;
  const tabsEl = document.getElementById('tabs');
  const panesEl = document.getElementById('panes');
  const dot = document.getElementById('dot'), connText = document.getElementById('conn-text');

  const buses = {};          // iface -> {tbody, pending:[], count, window, actEl, rateEl}
  let activeTab = 'debug';

  // ---- tabs / panes ----
  function activate(name){
    activeTab = name;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===name));
  }
  function makeTab(name, label){
    const tab=document.createElement('div'); tab.className='tab'; tab.dataset.tab=name;
    tab.innerHTML = `<span>${label}</span>`;
    tab.onclick=()=>activate(name);
    tabsEl.appendChild(tab);
    return tab;
  }

  // Debug pane (default)
  const debugTab = makeTab('debug','Debug'); debugTab.classList.add('active');
  const debugPane=document.createElement('div'); debugPane.className='pane active'; debugPane.dataset.pane='debug';
  const logEl=document.createElement('div'); logEl.className='log';
  debugPane.appendChild(logEl); panesEl.appendChild(debugPane);

  function addBus(ifc){
    if(buses[ifc]) return;
    const tab=makeTab(ifc, ifc);
    const act=document.createElement('span'); act.className='act'; tab.appendChild(act);
    const rate=document.createElement('span'); rate.className='rate'; tab.appendChild(rate);
    const pane=document.createElement('div'); pane.className='pane'; pane.dataset.pane=ifc;
    pane.innerHTML=`<table><thead><tr>
      <th style="width:118px">Time</th><th style="width:78px">ID</th>
      <th style="width:110px">Flags</th><th style="width:42px">Len</th><th style="width:180px">Data</th><th>Note</th>
      </tr></thead><tbody></tbody></table>
      <div class="placeholder">Waiting for frames…</div>`;
    panesEl.appendChild(pane);
    buses[ifc]={tbody:pane.querySelector('tbody'), ph:pane.querySelector('.placeholder'),
      pending:[], window:0, actEl:act, rateEl:rate};
  }

  // ---- stream ----
  function connect(){
    const es=new EventSource('/events');
    es.onopen=()=>{dot.className='dot live';connText.textContent='live';};
    es.onerror=()=>{dot.className='dot down';connText.textContent='reconnecting…';};
    es.onmessage=(ev)=>{ let m; try{m=JSON.parse(ev.data);}catch{return;}
      if(m.type==='frame') onFrame(m.f);
      else if(m.type==='log') onLog(m);
      else if(m.type==='status') onStatus(m);
    };
  }

  function onFrame(f){
    if(!buses[f.if]) addBus(f.if);
    const b=buses[f.if]; b.pending.push(f); b.window++;
  }
  function onLog(m){
    const d=new Date(m.t*1000);
    const line=document.createElement('div'); line.className='line';
    line.innerHTML=`<span class="t">${hms(d)}</span><span class="lv lv-${m.level}">${m.level}</span><span class="msg"></span>`;
    line.querySelector('.msg').textContent=m.msg;
    logEl.insertBefore(line, logEl.firstChild);
    while(logEl.childElementCount>MAX_LOG) logEl.removeChild(logEl.lastChild);
  }
  function onStatus(s){
    setV12(s.v12);
    setBattery(s.battery);
    setPill('ind-usonic', s.usonic);
    setPill('ind-camera', s.camera);
    setPill('ind-wifi', s.wifi);
    setPill('ind-eth', s.eth);
  }

  // ---- indicators ----
  function setV12(v){
    const el=document.getElementById('v12');
    const active = v==='active';
    el.className='v12 '+(active?'active':'inactive');
    el.textContent = active?'12V ACTIVE':'12V INACTIVE';
  }
  function setBattery(pct){
    const fill=document.getElementById('bat-fill'), lbl=document.getElementById('bat-pct');
    if(pct==null){ fill.style.width='0'; lbl.textContent='–'; return; }
    fill.style.width=Math.max(0,Math.min(100,pct))+'%';
    fill.style.background = pct<20?'var(--err)':pct<50?'var(--warn)':'var(--ok)';
    lbl.textContent=pct+'%';
  }
  function setPill(id, state){
    const el=document.getElementById(id); if(!el) return;
    el.className='pill '+state;
    el.textContent = state;
  }

  // ---- render loop (batched) ----
  function flush(){
    for(const ifc in buses){
      const b=buses[ifc];
      if(b.pending.length){
        b.ph.style.display='none';
        const frag=document.createDocumentFragment();
        for(let i=b.pending.length-1;i>=0;i--) frag.appendChild(rowFor(b.pending[i]));
        b.tbody.insertBefore(frag, b.tbody.firstChild);
        b.pending.length=0;
        while(b.tbody.childElementCount>MAX_ROWS) b.tbody.removeChild(b.tbody.lastChild);
      }
    }
    requestAnimationFrame(flush);
  }
  function rowFor(f){
    const tr=document.createElement('tr');
    const flags=[];
    if(f.ext) flags.push('<span class="badge b-ext">EXT</span>');
    if(f.fd)  flags.push('<span class="badge b-fd">FD</span>');
    if(f.brs) flags.push('<span class="badge b-brs">BRS</span>');
    if(f.rtr) flags.push('<span class="badge b-rtr">RTR</span>');
    if(f.err) flags.push('<span class="badge b-err">ERR</span>');
    const note=decodeNote(f);
    tr.innerHTML=`<td class="c-time">${hms(new Date(f.t*1000))}</td>`+
      `<td class="c-id">${f.id.padStart(f.ext?8:3,'0')}</td>`+
      `<td>${flags.join('')}</td><td class="c-len">${f.len}</td>`+
      `<td class="c-data">${fmtData(f.data)}</td>`+
      `<td class="c-note"></td>`;
    if(note) tr.lastElementChild.textContent=note;
    return tr;
  }
  function fmtData(h){let o='';for(let i=0;i<h.length;i+=2)o+=h.substr(i,2).toUpperCase()+' ';return o.trim();}
  function dataBytes(h){const b=[];for(let i=0;i+1<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));return b;}
  // Decode known TinyTrek frame IDs (reused firmware protocol -- see repo).
  function decodeNote(f){
    const d=dataBytes(f.data||''), id=(f.id||'').toUpperCase();
    if(id==='111'||id==='113'){
      const node=id==='111'?'L motor':'R motor';
      const steps=((d[0]||0)*0x1000000)+((d[1]||0)<<16)+((d[2]||0)<<8)+(d[3]||0);
      const dir=d[4]||0;
      const rpm=d[5]||0;                 // optional speed byte
      if(dir===0) return `${node} · stop`;
      // Consumed-buffer drive: +steps tops up the node's buffer at this rpm.
      return `${node} · drive ${dir===2?'rev':'fwd'} +${steps}${rpm?` @ ${rpm} rpm`:''}`;
    }
    if(id==='100'){ return `Pi · heartbeat #${d[0]||0}`; }
    if(id==='115'){ const p=d[0]||0; return p===1?'BMS · power ON (12V)':p===2?'BMS · power OFF':'BMS'; }
    if(id==='116'){
      const mv=((d[0]||0)<<8)+(d[1]||0);
      let s=`BMS · battery ${(mv/1000).toFixed(2)} V`;
      if(d.length>=3) s+= d[2]===1?' · 12V ON':d[2]===2?' · 12V off':'';
      if(d.length>=4 && (d[3]&1)) s+=' · LVC CUTOFF';
      return s;
    }
    return '';
  }
  function hms(d){return d.toLocaleTimeString('en-GB',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0');}

  // per-second: bus activity dots + rate labels
  setInterval(()=>{
    for(const ifc in buses){
      const b=buses[ifc];
      b.actEl.classList.toggle('on', b.window>0);
      b.rateEl.textContent = b.window? b.window+'/s':'';
      b.window=0;
    }
  },1000);

  // ---- controls ----
  // The motors are steppers: each command moves a fixed number of steps then stops.
  // So a direction button is HOLD-to-drive: it fires a move on press and repeats
  // while held (releasing simply stops sending more moves). STOP cuts the 12V rail.
  // Hold-to-drive keepalive interval (server sets it via /api/info, kept under the
  // firmware deadman): each repeat just refreshes the motor's deadman so it keeps
  // running smoothly; releasing stops the keepalives and the motor coasts to stop.
  let repeatMs = 150;
  function sendCmd(cmd){
    fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cmd})}).catch(()=>{});
  }
  function blip(btn){ btn.classList.add('press'); setTimeout(()=>btn.classList.remove('press'),120); }

  document.querySelectorAll('.pad button').forEach(btn=>{
    const cmd=btn.dataset.cmd;
    if(cmd==='stop'){
      btn.addEventListener('click',()=>{ blip(btn); sendCmd('stop'); });
      return;
    }
    let timer=null;
    btn._start=(e)=>{ if(e){ if(e.preventDefault)e.preventDefault();
        try{ if(e.pointerId!=null) btn.setPointerCapture(e.pointerId); }catch(_){} }
      if(timer)return;
      btn.classList.add('press'); sendCmd(cmd); timer=setInterval(()=>sendCmd(cmd),repeatMs); };
    // Release only stops the keepalives; the node's step buffer drains on its own.
    // Deliberately NO 'coast' here -- a spurious release must never be able to
    // wipe motion (that was zeroing the buffer between every frame).
    btn._stop=()=>{ if(timer){clearInterval(timer);timer=null;} btn.classList.remove('press'); };
    btn.addEventListener('pointerdown',btn._start);
    btn.addEventListener('pointerup',btn._stop);
    btn.addEventListener('pointercancel',btn._stop);
    // No 'pointerleave': the press transform shrinks the button under the pointer
    // and would fire leave mid-hold; setPointerCapture keeps the hold intact.
  });

  // keyboard hold-to-drive: arrows / WASD, Q/E rotate, Space or Esc = STOP
  const keymap={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',
    KeyW:'forward',KeyS:'back',KeyA:'left',KeyD:'right',KeyQ:'ccw',KeyE:'cw'};
  const held={};
  document.addEventListener('keydown',(e)=>{
    if(e.code==='Space'||e.code==='Escape'){ e.preventDefault(); sendCmd('stop'); return; }
    const cmd=keymap[e.code]; if(!cmd||held[e.code])return; held[e.code]=true;
    const btn=document.querySelector(`.pad button[data-cmd="${cmd}"]`);
    if(btn&&btn._start) btn._start(e);
  });
  document.addEventListener('keyup',(e)=>{
    const cmd=keymap[e.code]; if(!cmd)return; held[e.code]=false;
    const btn=document.querySelector(`.pad button[data-cmd="${cmd}"]`);
    if(btn&&btn._stop) btn._stop();
  });

  // ---- boot ----
  fetch('/api/info').then(r=>r.json()).then(info=>{
    if(info.car){ document.getElementById('car-id').textContent=info.car.id||'–';
      document.getElementById('car-host').textContent=info.car.host||''; }
    if(typeof info.repeatMs==='number' && info.repeatMs>0) repeatMs=info.repeatMs;
    // Only draw a bus tab if the server will actually stream that bus's frames.
    // On a competition car "frames" is empty (raw views are gated), so no tab is
    // drawn at all -- a locked panel rather than one stuck on "Waiting for frames".
    (info.frames||[]).filter(i=>(info.ifaces||[]).includes(i)).forEach(addBus);
    if(info.car && info.car.variant && !/production/i.test(info.car.variant)){
      const b=document.createElement('div'); b.className='variant-warn';
      b.textContent=info.car.variant;
      document.querySelector('header').appendChild(b);
    }
  }).catch(()=>{});
  connect();
  requestAnimationFrame(flush);
})();
</script>
</body>
</html>
