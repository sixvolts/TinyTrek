#@TYPE: Machine
#@NAME: ttos-ctf-hw
#@DESCRIPTION: Raspberry Pi 4 (64-bit) CTF vehicle board with Waveshare 2-CH CAN FD HAT

require conf/machine/raspberrypi4-64.conf

MACHINEOVERRIDES =. "ttos-ctf-hw:"

DEFAULTTUNE = "cortexa72"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-modules \
"

# --- Bootloader (§5.5 / §4.9) ------------------------------------------------
# U-Boot is DROPPED. An interruptible U-Boot prompt on the serial ops console is
# a password-free root shell (init=/bin/sh). With the console enabled this is not
# optional. RPI_USE_U_BOOT="0" boots the kernel directly via the RPi firmware,
# which presents no interruptible prompt. Go/no-go for §5.5.
RPI_USE_U_BOOT = "0"

# --- Serial ops console (§5.5) ----------------------------------------------
# GPIO UART (PL011 / ttyAMA0), freed by 'dtoverlay=disable-bt' (see rpi-config).
# meta-raspberrypi auto-enables serial-getty@<tty>.service for SERIAL_CONSOLES,
# which presents a password-gated login prompt. NOT a USB-facing port (§5.5 DECIDE
# -> GPIO UART / internal header).
ENABLE_UART = "1"
SERIAL_CONSOLES = "115200;ttyAMA0"

IMAGE_INSTALL:append = " kernel-image kernel-devicetree"
