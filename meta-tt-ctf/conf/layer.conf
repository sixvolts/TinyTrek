# meta-tt-ctf layer configuration
# Ported deliberately from sixvolts/TinyTrek:tinytrekos/meta-tt (see README §Porting).
# This is the CTF baseline layer. It intentionally diverges from the public layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tt-ctf"
BBFILE_PATTERN_meta-tt-ctf = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tt-ctf = "100"

LAYERDEPENDS_meta-tt-ctf = "core"
LAYERSERIES_COMPAT_meta-tt-ctf = "scarthgap"
