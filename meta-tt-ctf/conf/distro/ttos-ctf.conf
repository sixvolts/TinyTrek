DISTRO = "ttos-ctf"
DISTRO_NAME = "TinyTrekOS-CTF"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "ttos-ctf"

LOCALCONF_VERSION = "2"

# NOTE (§4.7): 'usbgadget' removed from DISTRO_FEATURES. The USB Ethernet/RNDIS
# gadget is dropped entirely. The only gadget kept is a serial ops console, and
# on this baseline the ops console is the GPIO UART (§5.5), which needs no
# usbgadget distro feature.
DISTRO_FEATURES:append = " multiarch systemd systemd-resolved"
DISTRO_EXTRA_RDEPENDS:append = " packagegroup-core-boot"
DISTRO_EXTRA_RRECOMMENDS:append = " kernel-module-af-packet"

# systemd as init
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_initscripts = ""
INIT_MANAGER = "systemd"

# Package backend
PACKAGE_CLASSES ?= "package_ipk"

# Raspberry Pi firmware licence acceptance (BCM43455 WiFi firmware).
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
