stages:
  - prepare
  - build
  - release

variables:
  PYTHON_VERSION: "3.12"
  DOCKER_CLI_EXPERIMENTAL: "enabled"

prepare:
  stage: prepare
  image: docker:24.0.5  # Ensure using a recent Docker version
  services:
    - docker:24.0.5-dind
  script:
    - |
      # Enable QEMU for cross-platform builds
      docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      # Create and set up Docker Buildx builder instance
      docker buildx create --use --name mybuilder --driver docker-container
      docker buildx inspect --bootstrap
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG'

build:
  stage: build
  image: docker:24.0.5  # Ensure using a recent Docker version
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - |
      # Cross-compile using Docker buildx
      docker buildx build --platform linux/arm64 -t farore/tinytrek-software:latest --build-arg PYTHON_VERSION=${PYTHON_VERSION} --output type=local,dest=build .
  artifacts:
    paths:
      - build/output/tinytrek
    expire_in: 1 day
  dependencies:
    - prepare
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build
  script:
    - echo "Creating GitLab multi-platform release..."
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Automatically generated multi-platform release for version $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Executable for ARM64"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/build/output/tinytrek"
  rules:
    - if: '$CI_COMMIT_TAG'
