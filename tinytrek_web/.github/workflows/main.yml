name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        env:
          PYTHON_VERSION: '3.12'
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: farore/tinytrek-software:latest
          build-args: PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          outputs: type=local,dest=build

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v3
        with:
          name: executable
          path: build/output/tinytrek

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Executable Artifact
      uses: actions/download-artifact@v3
      with:
        name: executable
        path: build/output

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/output/tinytrek
        tag_name: ${{ github.ref.name }}
        name: Release ${{ github.ref.name }}
        body: "Automatically generated multi-platform release for version ${{ github.ref.name }}"
        draft: false
        prerelease: false
        token: ${{ secrets.RELEASE_PAT }}