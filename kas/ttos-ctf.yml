header:
  version: 14

machine: ttos-ctf-hw
distro: ttos-ctf

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: scarthgap

  # NOTE (§4.9): meta-lts-mixins is DROPPED. In the old layer it was pinned to a
  # bare commit with no comment; it provides backported recipes for the linux-yocto
  # kernel, but this baseline uses the meta-raspberrypi kernel (linux-raspberrypi),
  # so the mixin contributed nothing we depend on. Removed to simplify the layer set.

  # This repository (kas resolves the layer path relative to the repo root).
  ttos-ctf-src:
    layers:
      meta-tt-ctf:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    IMAGE_FSTYPES += "wic wic.bmap"

    # §6 parallelism: sane start for 32 threads / 64 GB. Do NOT set both to 32.
    BB_NUMBER_THREADS = "16"
    PARALLEL_MAKE = "-j 8"

    # §4.4 FIX: the real variable is SSTATE_DIR (the old "SSTATE_CACHE" was a no-op).
    # §6: TMPDIR/SSTATE_DIR/DL_DIR live OUTSIDE the build tree so they survive
    # `rm -rf build/`, on fast storage. In the container these map to the mounted
    # /yocto volume (see docker/ + build.sh).
    SSTATE_DIR = "/yocto/sstate-cache"
    DL_DIR = "/yocto/downloads"
    TMPDIR = "/yocto/tmp"

    # Make /var/log a REAL directory on the rootfs instead of a symlink into the
    # /var/volatile tmpfs.
    #
    # Without this, journald's Storage=persistent is applied, reports no error, and
    # still loses everything on reboot -- because /var/log -> volatile/log means the
    # "persistent" journal is written to a tmpfs. Found on the bench 2026-08-03: the
    # drop-in was in place, systemd accepted it, and /var/log/journal never appeared.
    #
    # It matters here specifically because there is no RTC and journald is the only
    # record of a solve. Judges verify by the monotonic sequence the CTF layer logs,
    # but the log has to survive the power-cycle that hands the station to the next
    # team.
    VOLATILE_LOG_DIR = "no"

  no-secrets: |
    # §4.2: there are deliberately NO WiFi credentials or other secrets here.
    # SSID/PSK, console password hash, and (later) Data IDs / flag codes are all
    # per-car PROVISIONING data applied at first boot (§5.6), never build-time source.
    # If a future phase needs a build-time secret, put it in a gitignored
    # kas/ttos-ctf-secrets.yml include (see .gitignore), not in this file.

target:
  - ttos-ctf-image
